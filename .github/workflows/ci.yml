name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # wrangler 4.x refuses to run at all below Node 22 ("Wrangler
          # requires at least Node.js v22.0.0") — this is what actually
          # broke the very first run of this workflow (cf-typegen failing
          # with exit code 1), found by reproducing locally with a real
          # Node 20 binary rather than guessing from the exit code alone.
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run cf-typegen
      - run: npm run lint
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npm run test
      - run: npm run build

  # Read-only smoke tests against the live production site (see
  # e2e/smoke.spec.ts — no login, no data mutation). Runs on a schedule and
  # on manual trigger rather than every push, since it exercises the real
  # deployed app, not an isolated CI environment.
  smoke-e2e:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
